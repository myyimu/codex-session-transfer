[package]
name = "codex-session-transfer"
version = "0.1.19"
description = "Portable Codex session export and import utility"
authors = ["yimu"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/myyimu/codex-session-transfer"
repository = "https://github.com/myyimu/codex-session-transfer"

[lib]
name = "codex_session_transfer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
walkdir = "2"
zip = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
